[package]
name = "opendevicecontrol-core"
description = "Open-source protocol drivers for PC peripherals and hardware (Corsair today, more vendors coming)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hidapi = "2.6.7"
log = "0.4.35"
nvml-wrapper = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.37"
thiserror = "2.0.21"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_RemoteDesktop", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Performance", "Win32_System_LibraryLoader", "Win32_Devices_DeviceAndDriverInstallation"] }
# The opendevicecontrol-sensors service binary (Service Control Manager glue).
windows-service = "0.8"
# The same `windows` version and features sysinfo already builds (its WMI
# code), for LibreHardwareMonitor's WMI namespace.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Rpc", "Win32_System_Variant", "Win32_System_Wmi", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
