name: CI

# Every push and pull request is tested and packaged (the packages are
# kept as workflow artifacts). Pushing a tag `vX.Y.Z` also publishes a
# GitHub release with all packages.

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # The oldest supported runner, so the binary runs on older glibc too
    # (Pop!_OS / Ubuntu 22.04 and newer).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libpulse-dev
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="opendevicecontrol") | .version')"
          if [ "$want" != "$have" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $have in Cargo.toml"
            exit 1
          fi
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked -p opendevicecontrol
      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked
      - name: Package
        run: |
          mkdir -p dist pkg/opendevicecontrol
          cp target/release/opendevicecontrol README.md LICENSE pkg/opendevicecontrol/
          cp packaging/linux/opendevicecontrol.desktop packaging/linux/60-opendevicecontrol.rules \
             packaging/linux/opendevicecontrol.service packaging/linux/install.sh pkg/opendevicecontrol/
          cp -r packaging/linux/modules-load.d pkg/opendevicecontrol/
          cp assets/icons/opendevicecontrol-256.png pkg/opendevicecontrol/opendevicecontrol.png
          tar -C pkg -czf dist/opendevicecontrol-linux-x86_64.tar.gz opendevicecontrol
          cargo deb -p opendevicecontrol --no-build --output dist/opendevicecontrol-amd64.deb
          cargo generate-rpm -p crates/opendevicecontrol --output dist/opendevicecontrol-x86_64.rpm
      - name: Check the packages
        run: |
          dpkg-deb --info dist/opendevicecontrol-amd64.deb
          dpkg-deb --contents dist/opendevicecontrol-amd64.deb | grep -q usr/bin/opendevicecontrol
          dpkg-deb --contents dist/opendevicecontrol-amd64.deb | grep -q usr/lib/udev/rules.d/60-opendevicecontrol.rules
          tar -tzf dist/opendevicecontrol-linux-x86_64.tar.gz | grep -q opendevicecontrol/opendevicecontrol
          ./pkg/opendevicecontrol/opendevicecontrol --version
      - uses: actions/upload-artifact@v4
        with:
          name: opendevicecontrol-linux
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      # Two programs: opendevicecontrol-cli.exe (console, for the command line), then
      # opendevicecontrol.exe (windowed). The second build only relinks.
      - name: Build
        shell: pwsh
        run: |
          cargo build --release --locked -p opendevicecontrol --features console
          if ($LASTEXITCODE -ne 0) { throw "console build failed" }
          Copy-Item target/release/opendevicecontrol.exe target/release/opendevicecontrol-cli.exe
          cargo build --release --locked -p opendevicecontrol
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          cargo build --release --locked -p opendevicecontrol-core --bin opendevicecontrol-sensors
          if ($LASTEXITCODE -ne 0) { throw "sensor service build failed" }
      - name: Fetch PawnIO
        shell: pwsh
        run: packaging\windows\fetch-pawnio.ps1
      - name: Check the command-line program
        shell: pwsh
        run: |
          $out = & target/release/opendevicecontrol-cli.exe --version
          if ($out -notmatch '^opendevicecontrol \d') { throw "opendevicecontrol-cli --version printed '$out'" }
          $out
      # Inno Setup builds the installer. Runner images usually have it;
      # otherwise Chocolatey installs it.
      - name: Find Inno Setup
        shell: pwsh
        timeout-minutes: 10
        run: |
          function Find-Iscc {
            Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "installing Inno Setup failed" }
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          "Using $iscc"
          "ISCC=$iscc" >> $env:GITHUB_ENV
      - name: Package
        shell: pwsh
        run: |
          $version = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'opendevicecontrol').version
          New-Item -ItemType Directory dist, pkg | Out-Null
          Copy-Item target/release/opendevicecontrol.exe, target/release/opendevicecontrol-cli.exe, target/release/opendevicecontrol-sensors.exe, README.md pkg/
          Copy-Item packaging/windows/pawnio/PawnIO_setup.exe pkg/
          New-Item -ItemType Directory pkg/pawnio | Out-Null
          Copy-Item packaging/windows/pawnio/modules/*.bin pkg/pawnio/
          Copy-Item packaging/windows/pawnio/modules/COPYING pkg/pawnio/COPYING.txt
          Copy-Item LICENSE pkg/LICENSE.txt
          Compress-Archive -Path pkg/* -DestinationPath dist/opendevicecontrol-windows-x86_64.zip
          & $env:ISCC /Q "/DAppVersion=$version" packaging\windows\opendevicecontrol.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Copy-Item target/installer/opendevicecontrol-windows-x86_64-setup.exe dist/
      - name: Check the installer
        shell: pwsh
        timeout-minutes: 5
        run: |
          $dir = "$env:RUNNER_TEMP\opendevicecontrol-install"
          # Wait for setup itself only (Start-Process -Wait also waits for
          # anything it leaves running). No autostart task in CI.
          $p = Start-Process dist/opendevicecontrol-windows-x86_64-setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/TASKS=""', "/DIR=$dir" -PassThru
          if (-not $p.WaitForExit(180000)) { throw "the installer did not finish" }
          if ($p.ExitCode -ne 0) { throw "the installer exited with $($p.ExitCode)" }
          foreach ($f in 'opendevicecontrol.exe', 'opendevicecontrol-cli.exe', 'opendevicecontrol-sensors.exe', 'PawnIO_setup.exe', 'pawnio\AMDFamily17.bin') {
            if (-not (Test-Path "$dir\$f")) { throw "the installer did not install $f" }
          }
          $u = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -PassThru
          $null = $u.WaitForExit(120000)
      - uses: actions/upload-artifact@v4
        with:
          name: opendevicecontrol-windows
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
